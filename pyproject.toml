[project]
name = "anima"
version = "0.0.1"
description = "Agent-first MUD runtime"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "websockets>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
anima = "anima.session.cli:main"

[tool.setuptools.packages.find]
include = ["anima*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: replays a whole mud-agents log (~7s)"]
