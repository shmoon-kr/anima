# 공통 몸: 생존, 먹고 마시기, 휴식, 사냥, 탐험, 연습 (docs/SPEC-from-tintin.md §2)
sigil: 0
package: base
version: 0.1
description: 모든 에이전트의 공통 행동. 직업·역할·파티 패키지가 이 위에 쌓인다.

policies:
  flee_pct: 30            # 체력 % 아래로 떨어지면 도망 (서버 wimpy 도 같은 기준, 최대 체력 1/3 상한)
  rest_pct: 50            # 체력 % 아래면 쉼
  rest_mp_pct: 0          # 마나 % 아래면 쉼
  rest_mv: 20             # 이동력 아래면 쉼
  rest_mv_pct: 40         # 이동력 % 아래면 쉼 (서서 기다리는 것보다 쉬는 게 회복이 빠르다)
  hunt_min_hp: 60         # 이 체력 % 이상이면 사냥을 망설이지 않음
  roam: true              # 목표가 없으면 덜 가본 곳으로 돌아다님
  targets: []             # 사냥 대상 단어, 우선순위 순
  shun: [cityguard, Peacekeeper, guildmaster]   # 이게 방에 있으면 싸움을 걸지 않음 (경비가 몹 편을 든다)
  danger: [gelatinous]    # 들어오면 피하고, 싸우게 되면 바로 도망
  guild_room: ""          # 직업 패키지가 정함
  skill_plan: []          # [{skill, target(0~8), attack?}] 중요한 순서
  reserve_for: {}         # {기술: 열리는 레벨}: 다음 레벨 핵심 기술을 위해 연습 2회를 남김
  inertia: 0.1
  inv_hard: 16            # 이보다 많이 들면 남는 물건을 버린다 (보통은 그 전에 판다, D32)
  inv_keep: [food, drinkcon, light, key]
  inv_keep_each: 2        # 그 종류를 이만큼까지만 지닌다 (넘는 것은 버릴 것: 횃불 열 개가 가방을 막았다)
  sell_at: 6              # 팔 물건이 이만큼 쌓이면 장보기를 원한다 (D32)
  gold_reserve: 100       # 사고 나서도 남길 금화
  food_min: 2             # 음식이 이보다 적으면 빵집에서 산다
  drink_min: 1            # 물통이 없으면 물 가게에서 산다 (D33)
  thirst_trip_s: 180      # 이만큼 목마르면 마을 다녀오기에 분수대를 넣는다 (성직자가 물을 못 대 줄 때)
  pickup_min_cost: 20     # 바닥 물건은 값이 이 이상이거나 더 나은 장비거나 음식이면 줍는다
  gear_avoid: [anti_neutral]   # 쓸 수 없는 물건 표시 (세계 파일 ITEM_ANTI_*). 성향은 중립(-349..349). 직업 패키지가 더한다
  weapon_kinds: []        # 비어 있으면 아무 무기. 도적은 [pierce] (backstab, act.offensive.c:152)

# Animus(LLM) 이 바꿀 수 있는 값과 범위 (PHASE-2-PLAN S1, D27). 여기 없는 값은 바꿀 수 없다.
animus:
  policies:
    flee_pct:    {type: number, min: 15, max: 50, step: 10}
    rest_pct:    {type: number, min: 20, max: 70, step: 15}
    rest_mp_pct: {type: number, min: 0, max: 90, step: 20}
    rest_mv:     {type: number, min: 5, max: 60, step: 15}
    rest_mv_pct: {type: number, min: 10, max: 70, step: 15}
    hunt_min_hp: {type: number, min: 30, max: 95, step: 15}
    targets:     {type: words, max_len: 40}
    shun:        {type: words, max_len: 40, grow_only: true}     # 패키지 값은 빼지 못하고 더하기만
    danger:      {type: words, max_len: 40, grow_only: true}
    skill_plan:  {type: plan, max_len: 20}
    inv_keep:    {type: words, max_len: 8, grow_only: true}
    sell_at:     {type: number, min: 2, max: 14, step: 4}
    gold_reserve: {type: number, min: 0, max: 5000, step: 1000}
    food_min:    {type: number, min: 0, max: 6, step: 2}

reflexes:
  bag_full:                           # 너무 많이·무겁게 들어서 줍기·사기·받기·벗기가 실패: 버릴 때가 됐다
    on: items.failed
    if: "event.reason in ['too_many', 'too_heavy']"   # (hands_full on a give is the receiver's bag)
    do: ["mark('bag_full')"]
  bag_full_shop:                      # 산 것을 들 수 없다 (shop.result ok false)
    on: shop.result
    if: "event.ok == false and event.reason in ['too_many', 'too_heavy']"
    do: ["mark('bag_full')"]
  bag_full_tba:                       # tbaMUD 문구로는 items.cannot_take
    on: items.cannot_take
    if: "event.reason in ['too_many', 'too_heavy']"
    do: ["mark('bag_full')"]
  setup_on_enter:
    on: connection.in_game
    do:
      - "ensure_toggle('autoloot', true)"
      - "ensure_toggle('autogold', true)"
      - "ensure_toggle('autosplit', true)"
      - "send('score')"
      - "send('practice')"
      - "send('inventory')"
      - "send('equipment')"
      - "send('look')"           # 재접속(Reconnecting.)이면 서버가 방을 보여주지 않는다
      - "mark('entered')"
  keep_toggles_on:                    # 토글은 보낼 때마다 뒤집힌다: 꺼졌다는 응답이면 다시 켠다
    on: toggle.state
    if: "event.name in ['autoloot', 'autogold', 'autosplit', 'autoassist'] and event.value == false"
    do: ["ensure_toggle(event.name, true)"]
  wimpy_follows_policy:
    on: char.vitals_max
    do: ["set_wimpy(self.hp_max * policy.flee_pct / 100)"]
  flee_when_low:
    on: prompt
    if: "self.fighting and self.hp_pct < policy.flee_pct"
    do: ["flee()"]
    cooldown_s: 2
  flee_from_danger:
    on: combat.hit
    if: "(event.victim == 'self' or event.attacker == 'self') and (any_contains([event.attacker], policy.danger) or any_contains([event.victim], policy.danger))"
    do: ["flee()"]
    cooldown_s: 2
  wake_when_hit:
    on: combat.hit
    if: "event.victim == 'self' and self.position == 'sleeping'"
    do: ["stand()"]
  stand_when_woken:
    on: position
    if: "event.awakened_by != null"
    do: ["stand()", "send('look')"]
  avoid_danger_arriving:
    on: occupant.arrived
    if: "any_contains([event.who], policy.danger) and not self.fighting"
    do: ["stand()", "go_back()"]
    cooldown_s: 5
  leave_zone_above_level:             # 경고가 뜨면 왔던 길을 한 걸음씩 되짚는다
    on: zone.above_level
    do: ["go_back()"]
  refresh_room_when_target_missing:   # 우리가 아는 방 상태가 틀렸다: 다시 본다
    on: command.refused
    if: "event.reason == 'no_target'"
    do: ["send('look')"]
    cooldown_s: 5
  open_closed_door:                   # "The gate seems to be closed." → 문을 연다 (잠겼으면 move.failed locked)
    on: move.failed
    if: "event.reason == 'closed' and event.door != null"
    do: ["send('open ' + event.door)"]
    cooldown_s: 10
  refresh_inventory_when_item_missing:   # 주문 대상(물건)이 없다: 소지품 그림이 틀렸다
    on: skill.result
    if: "event.reason == 'no_target' and event.skill == null"
    do: ["send('inventory')"]
    cooldown_s: 20
  refresh_room_when_skill_target_missing:  # "Backstab who?" 등: 방 그림이 틀렸다
    on: skill.result
    if: "event.reason == 'no_target' and event.skill != null"
    do: ["mark('skill_target_missing')", "send('look')"]
    cooldown_s: 5
  give_refused:                       # "X seems to have her hands full." → 잠시 주지 않는다
    on: items.give_failed
    do: ["mark('give_failed')"]
  inventory_every_2min:                # 만든 음식·받은 물건 등 소지품 그림이 낡지 않게
    on: prompt
    if: "self.position != 'sleeping'"
    do: ["send('inventory')"]
    cooldown_s: 120
  no_mana:
    on: skill.result
    if: "event.reason == 'no_mana'"
    do: ["mark('no_mana')"]

behaviors:
  orient:                             # 어디 있는지 모르면 (잠결에 look 이 거부됐을 때 등) 다시 본다
    weight: 1.1
    when: "self.position != 'sleeping' and not self.fighting"
    considerations: ["bool(room.vnum == null and not room.dark)"]
    do: ["send('look')"]
    every_s: 5
  recount_party:                      # 추정으로는 같이 있는데 목록에 없다: 방 목록이 낡았다
    weight: 0.3
    when: "not self.fighting and self.position != 'sleeping'"
    considerations: ["step(party.unseen_here, 1)"]
    do: ["send('look')"]
    every_s: 15
  eat:
    weight: 1.0
    considerations: ["bool(self.hungry)", "bool(has_item('food'))"]
    do: ["stand()", "eat()"]
    every_s: 5
  drink:
    weight: 1.0
    considerations:
      - "bool(self.thirsty)"
      # 빈 물통("It is empty.")은 1분 동안 다시 마시지 않는다 (채우는 건 성직자·분수대)
      - "bool((has_item('drinkcon') and secs_since('drink_empty') > 60) or room.has_fountain)"
    do: ["stand()", "drink()"]
    every_s: 5
  rest:
    weight: 0.9
    camp: true                        # 이 필요가 파티 야영을 시작·유지한다 (D30)
    inertia: 0                        # 고려사항 안에 자기 히스테리시스가 있다 (D38)
    when: "not self.fighting and self.secs_since_alert > 20"
    considerations:
      # 기준 아래로 떨어지면 쉬기 시작해 체력 90% 까지 쉰다 (히스테리시스)
      - "max(max(inverse_linear(self.hp_pct, policy.rest_pct, 90), inverse_linear(self.mp_pct, policy.rest_mp_pct, 90)), max(max(below(self.mv, policy.rest_mv), below(self.mv_pct, policy.rest_mv_pct)), bool(self.behavior == 'rest' and (self.hp_pct < 90 or self.mv_pct < 60))))"
    do: ["rest()"]
    every_s: 10
  sleep:                              # 잠은 회복 +50% (쉬기 +25%): 방이 안전할 때만
    weight: 0.95
    camp: true                        # 이 필요가 파티 야영을 시작·유지한다 (D30)
    inertia: 0                        # 자기 히스테리시스가 있다 (D38)
    supersedes: [rest]                # 잘 수 있게 되면 쉬기에서 언제든 넘어간다 (회복 +50% 대 +25%)
    when: "not self.fighting and self.secs_since_alert > 20 and not room.dark and len(room.strangers) == 0 and not party.is_sentry"   # 보초는 자지 않는다 (D30)
    considerations:
      - "max(max(inverse_linear(self.hp_pct, policy.rest_pct, 90), inverse_linear(self.mp_pct, policy.rest_mp_pct, 90)), max(max(below(self.mv, policy.rest_mv), below(self.mv_pct, policy.rest_mv_pct)), bool(self.behavior == 'sleep' and (self.hp_pct < 90 or self.mv_pct < 60))))"
    do: ["sleep()"]
    every_s: 10
  # 장비와 물건 (D32): 더 나은 것을 입고, 상점 방에서는 필요 없는 것을 팔고 필요한 것을 산다
  wear_upgrade:
    weight: 0.6
    when: "not self.fighting and not party.camping"
    considerations: ["bool(upgrade_item())"]
    do: ["stand()", "wear_upgrade()"]
    every_s: 5
  sell_here:
    weight: 0.86
    when: "room.shop and not self.fighting"
    considerations: ["bool(sellable_here(policy.inv_keep))"]
    do: ["stand()", "mark('shopping')", "send('sell ' + sellable_here(policy.inv_keep))", "send('inventory')"]
    every_s: 3
  list_here:                          # 살 물건의 이름이 겹치면 (breast plate 와 bronze breast plate) 목록 번호로 사야 한다
    weight: 0.87
    when: "room.shop and not self.fighting"
    considerations: ["bool(list_needed(policy.gold_reserve))"]
    do: ["send('list')"]
    every_s: 10
  buy_here:
    weight: 0.86
    when: "room.shop and not self.fighting"
    considerations: ["bool(buy_here(policy.gold_reserve))"]
    do: ["stand()", "mark('shopping')", "send('buy ' + buy_here(policy.gold_reserve))", "send('inventory')", "send('score')"]
    every_s: 4
  fill_at_fountain:                   # 분수대에서 물통 채우기 (마을 다녀오기의 한 정거장, D33)
    weight: 0.86
    when: "room.has_fountain and not self.fighting and has_item('drinkcon')"
    considerations: ["step(secs_since('filled'), 600)"]
    do: ["stand()", "mark('shopping')", "send('fill ' + item_of('drinkcon') + ' fountain')", "mark('filled')"]
    every_s: 3
  pick_up:
    weight: 0.55
    when: "not self.fighting and len(self.inventory) < policy.inv_hard and not room.dark"
    considerations: ["bool(pickup_item(policy.pickup_min_cost))"]
    do: ["stand()", "send('get ' + pickup_item(policy.pickup_min_cost))", "send('inventory')"]
    every_s: 4
  share_gear:                         # 파티 전력: 나는 못 쓰거나 더 나은 걸 입었고, 같은 방 파티원에게는 개선인 장비를 준다.
    weight: 0.8                       # 명령 하나, 받을 사람이 같은 방에 있을 때만: 이동·탐험(≤0.75)보다 앞, 싸움·장보기·보급보다 뒤.
                                      # 아무도 안 쓰는 것은 팔고(장보기) 넘치면 버린다(junk_surplus)
    when: "not self.fighting and not party.camping"
    considerations: ["bool(gear_gift())"]
    do: ["stand()", "send('give ' + gear_gift())", "send('inventory')"]
    every_s: 4
  junk_surplus:
    weight: 0.5
    # 가방이 차서 무엇이 실패했으면(낮은 레벨은 inv_hard 전에 찬다) 그때도 버린다
    when: "not self.fighting and (len(self.inventory) > policy.inv_hard or secs_since('bag_full') < 120)"
    considerations: ["bool(surplus_item(policy.inv_keep))"]
    do: ["stand()", "send('junk ' + surplus_item(policy.inv_keep))", "send('inventory')"]
    every_s: 4
  stand_up:                           # 쉴 필요가 없어졌는데 앉거나 누워 있으면 일어난다 (리더는 쉬는 파티원을 기다린다)
    weight: 0.15
    when: "not self.fighting and self.position != 'standing'"
    considerations: ["bool(self.hp_pct >= 90 and self.mv_pct >= 60 and self.mp_pct >= max(policy.rest_mp_pct, 50))"]
    do: ["stand()"]
    every_s: 5
  hunt:
    weight: 0.7
    when: "not self.fighting and party.is_leader"
    considerations:
      - "bool(pick_target(policy.targets, policy.shun))"
      - "linear(self.hp_pct, policy.flee_pct, policy.hunt_min_hp)"
      - "bool(party.all_here)"
    do: ["stand()", "attack(pick_target(policy.targets, policy.shun))"]
  explore:
    weight: 0.2
    when: "not self.fighting and party.is_leader and policy.roam"
    considerations: ["linear(self.hp_pct, policy.rest_pct, 90)"]
    do: ["stand()", "explore()"]
    every_s: 2
  train:                              # 혼자일 때. 파티는 마을 다녀오기에 길드 문을 넣어 함께 간다 (train_on_trip)
    weight: 0.6
    when: "not self.fighting and policy.guild_room != '' and not room.dark and party.size <= 1"
    considerations:
      - "step(practices_spare(policy.reserve_for), 1)"
      - "bool(next_skill(policy.skill_plan))"
      - "linear(self.hp_pct, policy.rest_pct, 80)"
    task: train_at_guild
    retry_s: 3000

  train_on_trip:                      # 파티가 내 길드 문 앞에 멈췄다: 들어가 배우고 나온다 (따라가기보다 앞)
    weight: 1.15
    when: "not self.fighting and party.trip_stop != null and party.trip_stop == guild_door()"
    considerations: ["bool(train_wanted())"]
    task: train_at_guild
    retry_s: 600
tasks:
  train_at_guild:
    timeout_s: 900
    steps:
      - do: ["stand()"]
      - go_to: "policy.guild_room"
      - repeat:
          do: ["mark('training')", "practice(next_skill(policy.skill_plan))", "send('practice')"]
          while: "practices_spare(policy.reserve_for) > 0 and next_skill(policy.skill_plan) != null"
          max: 20
          every_s: 3
      - go_back: true

# Animus 에게 묻는 것 (PHASE-2-PLAN S4). 답은 기다리지 않는다: 오기 전에는 기본값(아무것도 안 바꿈).
# answer: patch 면 답이 자기 animus:<이름> 레이어의 손잡이 값을 바꾼다 (검증·잠금·되돌림은 overlay).
asks:
  self_tune:
    when: "not self.fighting and self.in_game"
    every_s: 1200
    question: >-
      Look at your last 30 minutes. Is time being lost because of you (the leader waiting while you rest,
      fleeing too early or too late, resting too often)? Propose changes to your own knobs, or none.
      Keys under facts.locked_by_strategist_s are decided by the party strategist: leave them.
    context: {level: self.level, hp_pct: self.hp_pct, mp_pct: self.mp_pct, mv_pct: self.mv_pct,
              position: self.position, behavior: self.behavior}
    facts: [knobs, locked, recent]
    answer: patch
    tier: local_fast
    priority: routine
    timeout_s: 120
    default: {changes: []}
  mob_risk:
    when: "len(room.unidentified) > 0 and not self.fighting"
    question: >-
      These creatures are not in the world data. If any is too strong to fight at your level, add a word
      from its description to shun (never attack) or to danger (leave the room at once). Otherwise change nothing.
    context: {creatures: room.unidentified, level: self.level, hp_pct: self.hp_pct}
    facts: [knobs]
    answer: patch
    tier: local_fast
    priority: danger
    timeout_s: 30
    default: {changes: []}
  stuck:
    when: "self.secs_in_behavior > 600 and self.behavior != null and self.behavior != 'rest' and self.behavior != 'sleep' and not self.fighting"
    question: >-
      You have been doing the same thing for over ten minutes. If it looks stuck, which of your knobs
      would get you moving again? Change nothing if it is fine.
    context: {behavior: self.behavior, task: self.task, room: room.name, exits: room.exits}
    facts: [knobs, locked, recent]
    answer: patch
    tier: local_fast
    priority: stuck
    timeout_s: 60
    default: {changes: []}
