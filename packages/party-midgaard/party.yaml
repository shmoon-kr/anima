# 미드가드 파티 (docs/SPEC-from-tintin.md §4-§5, brain/orders.md). 명단·역할 배정은 M7 에서 이 패키지에 더한다.
sigil: 0
package: party-midgaard
policies:
  targets: [newbie, quasit, crawler, monster, keeper, pet, thing, fido, janitor, odif, beggar, centipede, kobold, orc,
            hobgoblin, snake, lion, warrior, wolf, warg, apprentice, student, broom, adventurer, woman, cook,
            cockroach, butler, skeleton, zombie]
  shun: [cityguard, Peacekeeper, guildmaster, Mayor, blob, gelatinous, mercenary, knight, templar, sorcerer, dragon,
         golem, guardian]
  danger: [blob, gelatinous, dragon, golem, guardian]
  roster: [Vallen, Lil, Senia, Lumina, Elysia, Carmilla]
  leader: Vallen
  roles: {Vallen: [leader], Lumina: [healer], Elysia: [provider], Carmilla: [opener]}
  classes: {Vallen: warrior, Senia: warrior, Lil: mage, Lumina: cleric, Elysia: cleric, Carmilla: thief}
  fountain_room: "The Temple Square"
  rally: "The Entrance To The Newbie Zone"
  leash: 20
  circuit: ["The Entrance To The Newbie Zone", "The End Of The Path"]
  zone_ladder: true                   # 사냥터를 레벨에 맞는 지역에서 고르고, 위험했던 곳은 레벨이 오를 때까지 피한다 (D31)
  trip_cooldown_s: 1200              # 장보기 사이 최소 간격 (D32)
  camp_start: 0.9                     # 한 명의 휴식 필요(0~1)가 이만큼이면 같은 방 파티가 야영 (D30)
  camp_end: 0.3                       # 아무의 필요도 이보다 크지 않으면 야영 끝 (다 찰 때까지 기다리지 않는다)
animus:
  policies:                           # 파티 값: animus:party 레이어(전략가)만 바꿀 수 있다
    rally:   {type: room, party: true}
    circuit: {type: rooms, party: true, max_len: 4}
    leash:   {type: number, min: 5, max: 40, step: 10, party: true}
    camp_start: {type: number, min: 0.2, max: 1.0, step: 0.2, party: true}
    camp_end: {type: number, min: 0.0, max: 0.6, step: 0.2, party: true}
    trip_cooldown_s: {type: number, min: 600, max: 3600, step: 600, party: true}
behaviors:
  # 야영 (D30): 한 명이 쉬어야 하면 어차피 아무도 못 움직이니 같이 회복한다.
  # 보초(체력이 가장 많은 파티원)는 깨어서 쉬고, 나머지는 잠(회복 +50%). 위험하면 보초가 모두 깨운다.
  camp_sleep:
    weight: 0.89                      # 따라붙기·보급(0.92~1.2)보다 낮고, 사냥·탐험(≤0.85)보다 높다
    inertia: 0                        # 야영 시작·끝의 히스테리시스는 파티 칠판에 있다 (D38)
    supersedes: [camp_rest, rest]
    when: "party.camping and not party.is_sentry and not self.fighting and self.secs_since_alert > 20 and not room.dark and len(room.strangers) == 0"
    considerations: ["bool(party.camping)"]
    do: ["sleep()"]
    every_s: 10
  camp_rest:                          # 방이 안전하지 않으면 자지 말고 쉬기만
    weight: 0.88
    inertia: 0
    when: "party.camping and not party.is_sentry and not self.fighting and self.secs_since_alert > 20"
    considerations: ["bool(party.camping)"]
    do: ["rest()"]
    every_s: 10
  camp_watch:                         # 보초는 자지 않는다 (자는 사람은 반드시 맞고 두 배로 다친다: fight.c:885, 923)
    weight: 0.97
    inertia: 0
    supersedes: [sleep, camp_sleep, camp_rest, rest]   # 보초가 되면 자던 중이라도 바로 보초로
    when: "party.camping and party.is_sentry and not self.fighting and self.secs_since_alert > 20"
    considerations: ["bool(party.is_sentry)"]
    do: ["rest()"]
    every_s: 10
  hand_container_to_cleric:          # 물통은 성직자 손에 있어야 채워진다 (create water 는 자기 인벤토리만)
    weight: 0.92
    when: "not self.fighting and has_item('drinkcon') and not knows('create water')"
    targets: "party.members_in_room"
    considerations: ["bool(target.thirsty and target.class == 'cleric' and not target.has_drink and not target.is_self)",
                     "step(secs_since('give_failed'), 120)"]
    do: ["stand()", "send('give ' + item_of('drinkcon') + ' ' + target.name)"]
    every_s: 10

reflexes:
  sentry_raises_the_camp:             # 낯선 존재가 오면 보초가 모두 깨우고 일어선다 (깨워진 쪽은 stand_when_woken)
    on: occupant.arrived
    if: "party.is_sentry and party.camping and self.secs_since_alert < 2"
    do: ["wake_party()", "stand()"]
    cooldown_s: 10
  sentry_raises_the_camp_on_attack:   # 누가 맞으면: 자는 사람은 맞아도 안 깬다 (fight.c update_pos)
    on: [combat.hit, combat.aggro]
    if: "party.is_sentry and party.camping"
    do: ["wake_party()", "stand()"]
    cooldown_s: 5
