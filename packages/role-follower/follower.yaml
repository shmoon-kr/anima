# 따라가는 파티원 (SPEC §4): 리더에게 가서 follow + group join, 떨어지면 리더 방으로 간다.
sigil: 0
package: role-follower
reflexes:
  assist_on_join:
    on: group.change
    if: "event.event == 'joined' and event.who == self.name"
    do: ["ensure_toggle('autoassist', true)"]
behaviors:
  go_to_leader:                        # 쉬더라도 리더 곁에서 쉰다 (리더는 쉬는 파티원을 기다린다)
    weight: 1.1
    # 내가 어디 있는지 알 때만: 모르면 orient 가 먼저 본다 (round 40: 잠든 채 다시 접속해 look 이
    # 거부됐고, 깨운 뒤 이 행동이 같은 점수의 orient 를 34분 동안 이겼다. 리더는 모두 모이길 기다렸다)
    when: "not party.is_leader and not party.with_leader and room.vnum != null and party.leader_vnum != null and party.leader_vnum != room.vnum and party.leader_reachable and not self.fighting"
    considerations: ["step(self.mv, 10)"]
    do: ["stand()", "go_to(party.leader_vnum)"]
    every_s: 1
  wait_near_leader:                   # 리더가 나만 못 지나가는 출구 너머(다른 직업의 길드)에 있으면 그 앞에서 기다린다.
    weight: 0.95                      # 먹기·마시기(1.0)보다 낮다: 기다리는 동안 먹고 마신다
    when: "not party.is_leader and not party.with_leader and not party.leader_reachable and party.wait_vnum != null and party.wait_vnum != room.vnum and not self.fighting"
    considerations: ["1"]
    do: ["stand()", "go_to(party.wait_vnum)"]
    every_s: 1
  join_leader:                        # 따라가기가 먼저: 안 그러면 리더가 떠날 때마다 한 방씩 뒤처진다
    weight: 1.2
    when: "not party.is_leader and party.with_leader and not self.fighting"
    considerations: ["bool(not party.following or not party.in_group)"]
    do: ["stand()", "send('follow ' + party.leader)", "send('group join ' + party.leader)"]
    every_s: 6
  return_empty_container:               # 빈 물통은 보급 담당에게 (채워서 돌려준다)
    weight: 0.9
    when: "not self.fighting and has_item('drinkcon') and (member_with_role('provider') != null or member_with_role('healer') != null)"
    considerations: ["below(secs_since('drink_empty'), 120)"]
    do: ["stand()", "send('give ' + item_of('drinkcon') + ' ' + if_else(member_with_role('provider') != null, member_with_role('provider'), member_with_role('healer')))", "mark('drink_empty_done')"]
    every_s: 10
