# 복사해서 config/anima.toml 로 (gitignore). 환경 변수 ANIMA_TBAMUD_WORLD 가 있으면 그게 우선.
[paths]
world_dir = "../tbamud/lib/world"        # 로컬 tbaMUD 설치의 세계 파일 (저장소에 넣지 않는다)

[animus]                      # phase 2 LLM providers per tier: fake | lmstudio | claude (fake = phase-1 behaviour)
local_fast = "fake"
local_think = "fake"
claude = "fake"
local_url = "http://localhost:1234/v1"
local_model = "qwen/qwen3.8-27b"
claude_cmd = "claude"         # or the CLI bundled with your editor's Claude Code extension
claude_model = ""
claude_per_hour = 6
